ip virtual-router mac-address 00:1c:73:00:00:01
!
ip routing
ip routing vrf MGMT
!
ip prefix-list DEFAULT-ONLY
   seq 10 permit 0.0.0.0/0
!
ip prefix-list EXTERNAL-NET
   seq 10 permit 11.11.11.0/24
!
mlag configuration
   domain-id EDGE_RTRS
   local-interface Vlan4094
   peer-address 169.254.0.0
   peer-link Port-Channel1000
!
ip route vrf MGMT 0.0.0.0/0 192.168.130.1
!
route-map ISP-IN permit 10
   match ip address prefix-list DEFAULT-ONLY
!
route-map ISP-OUT permit 10
   match ip address prefix-list EXTERNAL-NET
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65000
   router-id 192.168.10.2
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 4 ecmp 4
   neighbor CORE peer group
   neighbor CORE remote-as 65001
   neighbor CORE bfd
   neighbor EDGE-IBGP peer group
   neighbor EDGE-IBGP remote-as 65000
   neighbor EDGE-IBGP next-hop-self
   neighbor EDGE-IBGP bfd
   neighbor EDGE-IBGP route-map RM-MLAG-PEER-IN in
   neighbor ISP1 peer group
   neighbor ISP2 peer group
   neighbor ISP2 remote-as 64502
   neighbor ISP2 bfd
   neighbor ISP2 route-map ISP-IN in
   neighbor ISP2 route-map ISP-OUT out
   neighbor 10.0.1.2 peer group ISP2
   neighbor 10.0.1.2 description isp-router-2
   neighbor 10.0.4.3 peer group CORE
   neighbor 10.0.4.3 description core-router-1
   neighbor 192.0.0.0 peer group EDGE-IBGP
   neighbor 192.0.0.0 description edge-router-1
   redistribute connected
   !
   address-family ipv4
      neighbor CORE activate
      neighbor EDGE-IBGP activate
      neighbor ISP1 activate
      neighbor ISP2 activate
      network 11.11.11.0/24
!
