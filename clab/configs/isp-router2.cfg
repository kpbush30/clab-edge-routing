switchport default mode routed
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
hostname isp-router2
ip name-server vrf MGMT 8.8.8.8 priority 1
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vrf instance MGMT
!
interface Ethernet1
   description To edge-router-2
   no switchport
   ip address 10.0.1.2/31
!
interface Ethernet2
   description To isp-router3
   no switchport
   ip address 10.0.3.3/31
!
interface Loopback0
   ip address 192.168.2.1/32
!
interface Management0
   vrf MGMT
   ip address 192.168.130.3/24
!
ip routing
ip routing vrf MGMT
!
ip prefix-list PL-ISP2-ORIGINATED
   seq 10 permit 198.51.100.0/24
   seq 20 permit 100.64.0.0/24
!
ip route vrf MGMT 0.0.0.0/0 192.168.130.1
!
router bgp 64502
   router-id 192.168.2.1
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 4 ecmp 4
   neighbor CUSTOMERS peer group
   neighbor CUSTOMERS remote-as 65000
   neighbor CUSTOMERS bfd
   neighbor ISP-ROOT peer group
   neighbor ISP-ROOT remote-as 64503
   neighbor ISP-ROOT bfd
   neighbor 10.0.1.3 peer group CUSTOMERS
   neighbor 10.0.1.3 description edge-router-2
   neighbor 10.0.3.2 peer group ISP-ROOT
   neighbor 10.0.3.2 description isp-router3
   !
   address-family ipv4
      neighbor CUSTOMERS activate
      neighbor ISP-ROOT activate
!
end
