[project]
name = "clab-edge-routing"
version = "0.1.0"
description = "Educational containerlab repository demonstrating edge routing resiliency with Arista cEOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyeapi>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pyavd==6.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "base: Base topology validation",
    "bgp_attributes: BGP attribute manipulation validation",
    "monitor_connectivity: Monitor connectivity failover validation",
    "pingcheck: PingCheck extension failover validation",
    "interface_tracking: Interface tracking validation",
]
